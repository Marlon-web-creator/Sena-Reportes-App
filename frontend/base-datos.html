<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SENA · Base de Datos</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-text">
        <h1>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <ellipse cx="12" cy="5" rx="8" ry="3" />
            <path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5" />
            <path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6" />
          </svg>
          Base de Datos
        </h1>
        <p class="subtitle">Gestión de archivos subidos y generados</p>
      </div>
      <a class="btn-database" href="index.html">← Volver</a>
    </header>

    <main class="db-page">
      <nav class="db-tabs">
        <button class="db-tab active" data-tab="subidos">
          Archivos subidos
        </button>
        <button class="db-tab" data-tab="generados">Archivos generados</button>

        <button id="btn-eliminar-todo" class="db-tab-danger" type="button">
          <svg
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 6h18" />
            <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
          </svg>
          Eliminar todo
        </button>
      </nav>

      <section id="tab-subidos" class="db-panel active">
        <!-- Ruta actual (breadcrumb) -->
        <div id="breadcrumb-carpetas" class="db-breadcrumb"></div>

        <!-- Barra de acciones de carpetas -->
        <div class="db-carpetas-toolbar">
          <button
            id="btn-nueva-carpeta"
            class="btn-nueva-carpeta"
            type="button"
          >
            <svg
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"
              />
              <path d="M12 11v4" />
              <path d="M10 13h4" />
            </svg>
            Nueva carpeta
          </button>
        </div>

        <!-- Carpetas de la ubicación actual -->
        <div id="grid-carpetas" class="db-carpetas-grid"></div>

        <form id="form-subir" class="upload-form">
          <input type="file" id="input-archivo" multiple required />
          <input
            type="text"
            id="input-modulo"
            placeholder="Módulo (opcional)"
          />
          <button type="submit">Subir archivos</button>
        </form>
        <div
          id="lista-archivos-seleccionados"
          class="upload-lista-seleccionados"
        ></div>
        <table class="db-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Módulo</th>
              <th>Tamaño</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-subidos"></tbody>
        </table>
      </section>

      <section id="tab-generados" class="db-panel">
        <table class="db-table">
          <thead>
            <tr>
              <th>Módulo</th>
              <th>Archivo</th>
              <th>Fecha</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-generados"></tbody>
        </table>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.js"></script>
    <script src="js/toasts.js"></script>
    <script src="js/modal.js"></script>
    <script src="auth/guard.js"></script>

    <script>
      // Carga base-datos.js SOLO cuando guard.js confirmó que hay sesión.
      (function esperarSesion() {
        if (document.documentElement.dataset.authed === "1") {
          const s = document.createElement("script");
          s.src = "js/base-datos.js";
          document.body.appendChild(s);
        } else {
          setTimeout(esperarSesion, 50);
        }
      })();
    </script>
  </body>
</html>
