<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verificador No Programados</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.css" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="index.html">&larr; Volver</a>
    <h1>Verificador No Programados</h1>
  </header>

  <main class="module-layout">
    <section class="panel">
      <h2>1. Configuración</h2>

      <label class="field">
        <span>Consolidado General (.xlsx)</span>
        <input type="file" id="excel" accept=".xlsx,.xlsm" />
      </label>

      <label class="field">
        <span>Carpeta BD con los PDFs (una subcarpeta por ficha)</span>
        <input type="file" id="pdfs" webkitdirectory directory multiple />
      </label>
      <p class="field folder-hint">
        Selecciona la carpeta "BD" completa (con sus subcarpetas por ficha). El navegador subirá todos los PDF que contenga.
      </p>

      <div id="resumenSeleccion" class="file-list"></div>

      <button id="btnProcesar" class="btn-primary">Procesar</button>

      <div id="bloqueProgreso" class="oculto">
        <div class="barra-progreso-contenedor">
          <div id="barraProgreso" class="barra-progreso"></div>
        </div>
        <div id="mensajeProgreso" class="progreso-mensaje">Iniciando…</div>
      </div>
    </section>

    <section class="panel">
      <h2>2. Resultado</h2>
      <div id="resultado" class="resultado">
        <p class="placeholder">Aquí aparecerán las estadísticas y el archivo generado.</p>
      </div>
    </section>

    <section class="panel">
      <h2>3. Historial reciente</h2>
      <div id="historial" class="historial"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.js"></script>
  <script src="js/toasts.js"></script>
  <script src="js/api.js"></script>
  <script src="js/no-programados.js"></script>
</body>
</html>
