<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SENA · Base de Datos</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <div class="login-brand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <ellipse cx="12" cy="5" rx="8" ry="3" />
            <path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5" />
            <path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6" />
          </svg>
          <h1>Base de Datos</h1>
        </div>

        <p class="subtitle">Ingresa la contraseña para continuar.</p>

        <form id="form-login" class="login-form" autocomplete="on">
          <label class="field">
            <span>Contraseña</span>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              autofocus
            />
          </label>

          <button type="submit">Entrar</button>
        </form>

        <p id="error" class="login-error" role="alert" aria-live="polite"></p>

        <p class="login-foot">SENA · Reportes</p>
      </section>
    </main>

    <script>
      // Si ya hay sesión, salta directo a base-datos.html
      fetch("/api/auth/me", { credentials: "include" }).then((r) => {
        if (r.ok) location.replace("../base-datos.html");
      });

      const form = document.getElementById("form-login");
      const err  = document.getElementById("error");
      const btn  = form.querySelector("button");
      const input = document.getElementById("password");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.textContent = "";
        btn.disabled = true;
        btn.textContent = "Verificando…";

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ password: input.value }),
          });

          if (res.ok) {
            location.href = "../base-datos.html";
            return;
          }

          const data = await res.json().catch(() => ({}));
          err.textContent = data.detail || "Contraseña incorrecta";
          input.select();
        } catch {
          err.textContent = "No se pudo conectar con el servidor.";
        } finally {
          btn.disabled = false;
          btn.textContent = "Entrar";
        }
      });
    </script>
  </body>
</html>
